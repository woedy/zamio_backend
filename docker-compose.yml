version: "3.9"

services:
  db:
    image: postgres:15
    container_name: zamio_db
    restart: always
    environment:
      POSTGRES_USER: zamio_postgres
      POSTGRES_PASSWORD: zamio_postgres
      POSTGRES_DB: zamio_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamio_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: zamio_redis
    restart: always
    ports:
      - "6379:6379"

  zamio_app:
    build:
      context: .
    container_name: zamio_app
    command: gunicorn core.wsgi:application --bind 0.0.0.0:6161 --workers 3 --timeout 120
    volumes:
      - .:/zamio_django
      - ./static_cdn:/var/lib/static_cdn
    ports:
      - "6161:6161"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1

  django_manage:
    build:
      context: .
    container_name: django_manage
    command: tail -f /dev/null   # idle, so you can exec into it
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    tty: true
    environment:
      - DATABASE_URL=postgres://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1

  celery:
    build:
      context: .
    container_name: zamio_celery
    command: celery -A core worker -l info
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1

  celery-beat:
    build:
      context: .
    container_name: zamio_celery_beat
    command: celery -A core beat -l info
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONUNBUFFERED=1

volumes:
  postgres_data:
