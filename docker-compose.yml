version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zamio_postgres
      POSTGRES_USER: zamio_postgres
      POSTGRES_PASSWORD: zamio_postgres
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamio_postgres -d zamio_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    expose:
      - "8000"
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"

      # Database
      DATABASE_URL: postgresql://zamio_postgres:zamio_postgres@db:5432/zamio_postgres

      # Redis + Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Wildcard domain settings
      ALLOWED_HOSTS: ".pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,web"
      CSRF_TRUSTED_ORIGINS: "https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"

    volumes:
      - .:/zamio_django
      - ./static_cdn:/zamio_django/static_cdn
      - ./media:/zamio_django/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/admin/login/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  celery_worker:
    build: .
    command: celery -A core worker -l INFO
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DATABASE_URL: postgresql://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ".pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,web"
      CSRF_TRUSTED_ORIGINS: "https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: .
    command: celery -A core beat -l INFO
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DATABASE_URL: postgresql://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ".pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,web"
      CSRF_TRUSTED_ORIGINS: "https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
