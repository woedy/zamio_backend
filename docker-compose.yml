version: "3.9"

services:
  db:
    image: postgres
    container_name: zamio_postgres_db
    environment:
      - POSTGRES_DB=zamio_postgres
      - POSTGRES_USER=zamio_postgres
      - POSTGRES_PASSWORD=zamio_postgres
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamio_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: zamio_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zamio_app:
    build:
      context: .
    container_name: zamio_app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "6161:8000"   # host:container
    volumes:
      - .:/zamio_django
      - ./static_cdn:/var/lib/static_cdn
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  celery_worker:
    build:
      context: .
    container_name: zamio_celery_worker
    command: celery -A core worker -l info
    volumes:
      - .:/zamio_django
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      zamio_app:
        condition: service_healthy

  celery_beat:
    build:
      context: .
    container_name: zamio_celery_beat
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/zamio_django
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      zamio_app:
        condition: service_healthy

volumes:
  static_cdn:
