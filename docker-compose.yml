version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: zamio_production
      POSTGRES_USER: zamio_prod_user
      POSTGRES_PASSWORD: zamio_prod_password
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamio_prod_user -d zamio_production"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - zamio_prod_network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass zamio_redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - zamio_prod_network

  zamio_app:
    build: 
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      # Security
      SECRET_KEY: ${SECRET_KEY:-django-insecure-wg=khcu9^_pyr8j675w94-^6bd_8g-1i#t((1=i#2zer645d9&}
      # Database
      DATABASE_URL: postgresql://zamio_prod_user:zamio_prod_password@db:5432/zamio_production
      # Redis + Celery
      REDIS_URL: redis://:zamio_redis_password@redis:6379/0
      CELERY_BROKER_URL: redis://:zamio_redis_password@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:zamio_redis_password@redis:6379/0
      # Domain configuration
      ALLOWED_HOSTS: "zamio.api.pleromaspringsfoundation.com,.pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,zamio_app"
      CSRF_TRUSTED_ORIGINS: "https://zamio.api.pleromaspringsfoundation.com,https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"
      # Production settings
      BASE_URL: "https://zamio.api.pleromaspringsfoundation.com"
    volumes:
      - ./static_cdn:/zamio_django/static_cdn
      - ./media:/zamio_django/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - zamio_prod_network
    labels:
      # Coolify labels for proper routing
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.zamio.rule=Host(`zamio.api.pleromaspringsfoundation.com`)"
      - "traefik.http.routers.zamio.tls=true"
      - "traefik.http.routers.zamio.tls.certresolver=letsencrypt"
      - "traefik.http.services.zamio.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.zamio-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.zamio.middlewares=zamio-headers"
    # Allow Django commands to be run in Coolify terminal
    stdin_open: true
    tty: true

  celery_worker:
    build: 
      context: .
      dockerfile: Dockerfile
    command: celery -A core worker -l INFO --concurrency=2 --max-tasks-per-child=1000
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DATABASE_URL: postgresql://zamio_prod_user:zamio_prod_password@db:5432/zamio_production
      REDIS_URL: redis://:zamio_redis_password@redis:6379/0
      CELERY_BROKER_URL: redis://:zamio_redis_password@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:zamio_redis_password@redis:6379/0
      ALLOWED_HOSTS: "zamio.api.pleromaspringsfoundation.com,.pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,zamio_app"
      CSRF_TRUSTED_ORIGINS: "https://zamio.api.pleromaspringsfoundation.com,https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"
      BASE_URL: "https://zamio.api.pleromaspringsfoundation.com"
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zamio_prod_network

  celery_beat:
    build: 
      context: .
      dockerfile: Dockerfile
    command: celery -A core beat -l INFO --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DATABASE_URL: postgresql://zamio_prod_user:zamio_prod_password@db:5432/zamio_production
      REDIS_URL: redis://:zamio_redis_password@redis:6379/0
      CELERY_BROKER_URL: redis://:zamio_redis_password@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:zamio_redis_password@redis:6379/0
      ALLOWED_HOSTS: "zamio.api.pleromaspringsfoundation.com,.pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,zamio_app"
      CSRF_TRUSTED_ORIGINS: "https://zamio.api.pleromaspringsfoundation.com,https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"
      BASE_URL: "https://zamio.api.pleromaspringsfoundation.com"
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zamio_prod_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  zamio_prod_network:
    driver: bridge