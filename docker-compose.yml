version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zamio_postgres
      POSTGRES_USER: zamio_postgres
      POSTGRES_PASSWORD: zamio_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamio_postgres -d zamio_postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - zamio_network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - zamio_network

  zamio_app:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    expose:
      - "8000"  # Only expose internally, let Coolify handle external routing
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      # Database
      DATABASE_URL: postgresql://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      # Redis + Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Updated domain configuration
      ALLOWED_HOSTS: "zamio.api.pleromaspringsfoundation.com,.pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,zamio_app"
      CSRF_TRUSTED_ORIGINS: "https://zamio.api.pleromaspringsfoundation.com,https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"
    volumes:
      - ./static_cdn:/zamio_django/static_cdn
      - ./media:/zamio_django/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || curl -fsS http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - zamio_network
    labels:
      # Coolify labels for proper routing
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.zamio.rule=Host(`zamio.api.pleromaspringsfoundation.com`)"
      - "traefik.http.routers.zamio.tls=true"
      - "traefik.http.routers.zamio.tls.certresolver=letsencrypt"
      - "traefik.http.services.zamio.loadbalancer.server.port=8000"

  celery_worker:
    build: .
    command: celery -A core worker -l INFO --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DATABASE_URL: postgresql://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: "zamio.api.pleromaspringsfoundation.com,.pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,zamio_app"
      CSRF_TRUSTED_ORIGINS: "https://zamio.api.pleromaspringsfoundation.com,https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      zamio_app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zamio_network

  celery_beat:
    build: .
    command: celery -A core beat -l INFO --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DATABASE_URL: postgresql://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: "zamio.api.pleromaspringsfoundation.com,.pleromaspringsfoundation.com,pleromaspringsfoundation.com,localhost,zamio_app"
      CSRF_TRUSTED_ORIGINS: "https://zamio.api.pleromaspringsfoundation.com,https://*.pleromaspringsfoundation.com,https://pleromaspringsfoundation.com"
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      zamio_app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zamio_network

volumes:
  postgres_data:

networks:
  zamio_network:
    driver: bridge