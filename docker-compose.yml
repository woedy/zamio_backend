version: "3.9"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: zamio_postgres
      POSTGRES_USER: zamio_postgres
      POSTGRES_PASSWORD: zamio_postgres
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamio_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    # no code bind mount in prod
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DATABASE_URL: postgres://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # For first test via port; later remove this and use Coolify domain
    ports:
      - "6161:8000"
    volumes:
      - static_cdn:/zamio_django/static_cdn
      - media:/zamio_django/media

  celery:
    build: .
    command: celery -A core worker -l INFO
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DATABASE_URL: postgres://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A core beat -l INFO
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DATABASE_URL: postgres://zamio_postgres:zamio_postgres@db:5432/zamio_postgres
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dbdata:
  static_cdn:
  media:
