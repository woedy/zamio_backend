services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: zamio_postgres
      POSTGRES_USER: zamio_postgres
      POSTGRES_PASSWORD: zamio_postgres
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamio_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zamio_app:
    build: .
    volumes:
      - .:/zamio_django
      - static_cdn:/var/lib/static_cdn
    ports:
      - "6161:8000"   # 8000 inside container, 6161 outside
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    command: celery -A core worker -l INFO
    volumes:
      - .:/zamio_django
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A core beat -l INFO
    volumes:
      - .:/zamio_django
    depends_on:
      - db
      - redis

  zamio_frontend:
    build:
      context: ../zamio_frontend
    ports:
      - "4173:4173"
    volumes:
      - ../zamio_frontend:/zamio_frontend
      - /zamio_frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:6161
    depends_on:
      - zamio_app
