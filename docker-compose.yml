services:
  # Redis
  redis:
    image: redis:alpine
    container_name: zamio_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Postgres Database
  db:
    image: postgres
    container_name: zamio_postgres_db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=zamio_postgres
      - POSTGRES_USER=zamio_postgres
      - POSTGRES_PASSWORD=zamio_postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamio_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application
  zamio_app:
    build:
      context: .
    container_name: zamio_app
    command: python manage.py runserver 0.0.0.0:6161
    volumes:
      - .:/zamio_django
      - ./static_cdn:/var/lib/static_cdn
    ports:
      - "6161:6161"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true   # no healthcheck loop to kill terminal

  # Django Management (manual commands: migrate, createsuperuser, etc.)
  django_manage:
    build:
      context: .
    container_name: django_manage
    command: tail -f /dev/null   # keep container alive
    volumes:
      - .:/zamio_django
    depends_on:
      db:
        condition: service_healthy
    tty: true

  # Celery Worker
  celery:
    build:
      context: .
    container_name: zamio_celery
    command: celery -A core worker -l DEBUG
    volumes:
      - .:/zamio_django
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
    container_name: zamio_celery_beat
    command: celery -A core beat -l DEBUG
    volumes:
      - .:/zamio_django
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  static_cdn:
