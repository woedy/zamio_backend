version: "3.8"

services:
  # Redis
  redis:
    image: redis:alpine
    container_name: core_redis

  # Database Postgres
  db:
    image: postgres
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=core_postgres
      - POSTGRES_USER=core_postgres
      - POSTGRES_PASSWORD=core_postgres
    container_name: core_postgres_db

  # Django Application
  core_app:
    build:
      context: .
    volumes:
      - .:/core_django
      - ./static_cdn:/var/lib/static_cdn
    ports:
      - 6161:6161
    container_name: core_app
    command: python manage.py runserver 0.0.0.0:6161
    depends_on:
      - db

  # React Application
  core_frontend:
    build:
      context: ../core_frontend  # Adjust the path to your React app
    ports:
      - "4173:4173"  # Map to the host's port
    environment:
      - REACT_APP_API_URL=http://core_app:6161  # API URL for Django service

  # Celery Worker
  celery:
    restart: always
    build:
      context: .
    command: celery -A core worker -l DEBUG
    volumes:
      - .:/core_django
    container_name: core_celery
    depends_on:
      - db
      - redis
      - core_app

  # Celery Beat
  celery-beat:
    restart: always
    build:
      context: .
    command: celery -A core beat -l DEBUG
    volumes:
      - .:/core_django
    container_name: core_celery_beat
    depends_on:
      - db
      - redis
      - core_app

volumes:
  static_cdn:
