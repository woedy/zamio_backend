[phases.setup]
nixPkgs = ["python39", "python39Packages.pip", "ffmpeg", "libsndfile", "gcc", "libffi", "postgresql"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",  # Create a virtual environment
    "source /opt/venv/bin/activate",  # Activate the virtual environment
    "pip install --upgrade pip setuptools wheel",
    "pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "python manage.py collectstatic --noinput",
    "python manage.py migrate --noinput"
]

[start]
cmd = "source /opt/venv/bin/activate && gunicorn --bind 0.0.0.0:$PORT --workers 3 --timeout 120 core.wsgi:application"

[variables]
PYTHONUNBUFFERED = "1"
PATH = "/opt/venv/bin:$PATH"  # Ensure the virtual environment's bin directory is in PATH