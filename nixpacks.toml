[phases.setup]
nixPkgs = [
  "python310",
  "python310Packages.pip",
  "python310Packages.setuptools",
  "python310Packages.wheel",
  "python310Packages.cython",
  "ffmpeg",
  "libsndfile",
  "gcc",
  "libffi",
  "pkg-config",
  "postgresql",
  "blas",
  "lapack",
  "bash",
  "coreutils"   # extra: ensures /bin/sh is present
]

[phases.install]
cmds = [
  "pip install numpy scipy",
  "pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "python manage.py collectstatic --noinput",
  "python manage.py migrate --noinput"
]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT --workers 3 --timeout 120 core.wsgi:application"

[variables]
PYTHONUNBUFFERED = "1"
