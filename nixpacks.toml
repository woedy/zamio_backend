[phases.setup]
nixPkgs = [
  "python310"
  "python310Packages.pip"
  "ffmpeg"
  "libsndfile"
  "gcc"
  "libffi"
  "pkg-config"
  "postgresql"
  "blas"
  "lapack"
]

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools wheel cython",
  "pip install numpy scipy",
  "pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "python manage.py collectstatic --noinput",
  "python manage.py migrate --noinput"
]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT --workers 3 --timeout 120 core.wsgi:application"

[variables]
PYTHONUNBUFFERED = "1"
